services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linebot
      POSTGRES_PASSWORD: linebot
      POSTGRES_DB: linebot
    ports:
      # Loopback only: the password is the public default above.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linebot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bridge:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "service:bridge"
    depends_on:
      - bridge
    restart: unless-stopped

volumes:
  pgdata:
